name: CI/CD Karsajobs Backend

# Jalankan CI saat push atau pull request ke branch karsajobs
on:
  push:
    branches: [ karsajobs, main ]
  pull_request:
    branches: [ karsajobs, main ]

jobs:
  # Job 1: Lint Dockerfile menggunakan hadolint
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Lint Dockerfile — pastikan mengikuti best practice
      - name: Lint Dockerfile dengan hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  # Job 2: Jalankan unit test aplikasi Go
  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Siapkan Go toolchain sesuai versi di Dockerfile
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.15'

      # Jalankan semua unit test; -short melewati test yang berjalan lama
      - name: Jalankan Unit Test
        run: go test -v -short --count=1 $(go list ./...)

  # Job 3: Build dan push image ke GHCR (hanya jika lint & test berhasil)
  build-app-karsajobs:
    needs: [lint-dockerfile, test-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Login ke GitHub Container Registry menggunakan GITHUB_TOKEN otomatis
      - name: Login ke GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      # Build image dan beri tag sesuai format GHCR
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/karsajobs:latest .

      # Push image ke GHCR agar dapat ditarik oleh Kubernetes
      - name: Push image ke GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/karsajobs:latest
